name: Publish academic website

on:
  push:
    branches: [main]
    paths: [website.zip]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Extract static website
        run: |
          unzip -q website.zip -d bundle
          test -f bundle/website/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: bundle/website
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
